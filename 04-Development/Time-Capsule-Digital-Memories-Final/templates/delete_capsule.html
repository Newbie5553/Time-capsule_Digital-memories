{% extends 'base.html' %}
{% block content %}
<a class="back" href="{{ url_for('view_capsule', capsule_id=capsule.id) }}">← Back to your draft</a>
<section class="panel delete-panel">
    <p class="eyebrow">BEFORE YOU LET IT GO</p>
    <h1>Delete this draft?</h1>
    <p class="wrap-title"><strong>{{ capsule.title }}</strong></p>
    <p>This permanently removes the message and all its attachments. This cannot be undone.</p>
    <form method="post">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <input type="hidden" name="confirm" value="delete">
        <div class="delete-actions">
            <a class="button secondary" href="{{ url_for('view_capsule', capsule_id=capsule.id) }}">Keep my draft</a>
            <button class="button danger">Yes, delete draft</button>
        </div>
    </form>
</section>
{% endblock %}
