{% extends 'base.html' %}{% block content %}<section class="panel" style="max-width:560px;margin:40px auto;padding:32px"><h1>Forgot password?</h1><p>Enter your registered email to request a reset link. Email delivery requires SMTP configuration.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" required maxlength="254" autocomplete="email"></label><button class="button" type="submit">Request reset link</button></form><p><a href="{{ url_for('login') }}">Back to sign in</a></p></section>{% endblock %}
